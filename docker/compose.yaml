name: inference-platform

services:
  vllm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1@sha256:c2f3b1b964e47809b722b5e75b61b1e7b39a50f70388cf2bf2418f16a9f31da2}
    image: inference-platform/vllm:0.27.1
    container_name: inference-vllm
    labels:
      app: inference-platform
      component: vllm
    restart: "no"
    ipc: host
    shm_size: "8gb"
    ports:
      - "${HOST_PORT:-8000}:${CONTAINER_PORT:-8000}"
    env_file:
      - path: ../.env.local
        required: false
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    volumes:
      - type: bind
        source: ${HF_HOME:-../.cache/huggingface}
        target: /root/.cache/huggingface
    gpus: all
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    command:
      - --model
      - ${MODEL_PATH:-${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct-AWQ}}
      - --revision
      - ${MODEL_REVISION:-3ecffa0ceb27851800f45519bab9c457a04405e1}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen2.5-1.5b-instruct-awq}
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - --pipeline-parallel-size
      - ${VLLM_PIPELINE_PARALLEL_SIZE:-1}
      - --distributed-executor-backend
      - ${DISTRIBUTED_EXECUTOR_BACKEND:-mp}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-8}
      - --host
      - 0.0.0.0
      - --port
      - ${CONTAINER_PORT:-8000}
