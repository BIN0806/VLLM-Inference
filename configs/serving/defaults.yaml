host: 0.0.0.0
host_bind: 127.0.0.1
container_port: 8000
host_port: 8000
gpu_memory_utilization: 0.90
max_model_len: 8192
max_num_seqs: 8
trust_remote_code: false
enable_prefix_caching: false
dtype: auto
kv_cache_dtype: auto
shm_size: 8g
health_path: /health
metrics_path: /metrics
openai_prefix: /v1
request_timeout_seconds: 120
notes: |
  Conservative portable defaults. Per-rental overrides come from environment
  variables (VLLM_MAX_MODEL_LEN, VLLM_MAX_NUM_SEQS, VLLM_GPU_MEMORY_UTILIZATION).
  Publish Compose ports on 127.0.0.1 by default for SSH-tunneled development.
  In-container `--host 0.0.0.0` is the process listen address, not the host bind.
  VLLM_API_KEY does not protect every vLLM endpoint (health and metrics may remain
  unauthenticated). External production exposure requires an authenticating reverse
  proxy or firewall. The Vast portal authenticated reverse proxy is the current
  external boundary.
