host: 0.0.0.0
host_bind: 127.0.0.1
container_port: 8000
host_port: 8000
gpu_memory_utilization: 0.90
max_model_len: 8192
max_num_seqs: 2
trust_remote_code: false
enable_prefix_caching: false
dtype: auto
kv_cache_dtype: auto
shm_size: 2g
health_path: /health
metrics_path: /metrics
openai_prefix: /v1
request_timeout_seconds: 120
notes: |
  Constrained two-GPU k3s serving. max_num_seqs=2 and 2Gi shm keep host RAM
  near 24.5 GiB. Do not restore max_num_seqs=8 or 8Gi shm on this host class.
