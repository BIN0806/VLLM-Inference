id: k8s-replica
description: One Kubernetes pod is one complete vLLM replica. KEDA scales whole replicas, min=1.
gpus_per_replica: 1
tensor_parallel_size: 1
pipeline_parallel_size: 1
distributed_executor_backend: mp
replica_count: 1
min_replicas: 1
max_replicas: null
scaling_unit: complete-replica
horizontal_scaling: false
scaler: keda-prometheus
requires_durable_interceptor: false
status: unvalidated
notes: |
  First Kubernetes target: one warm complete replica, TP=1, PP=1, executor mp,
  nvidia.com/gpu: 1. Do not install KEDA, Prometheus, or KubeRay for this gate.
  The scaler field is reserved for a later approved gate. Provider-neutral
  base manifests plus overlays. Unvalidated until a GPU-capable cluster exists.
  Do not claim EKS, GKE, minikube, or k3s acceptance yet.
