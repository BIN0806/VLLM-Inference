id: k8s-replicas
description: Two-replica-capable k3s workload. One complete vLLM replica per GPU. Phase 4C HTTP interceptor scale-to-zero lab.
gpus_per_replica: 1
tensor_parallel_size: 1
pipeline_parallel_size: 1
distributed_executor_backend: mp
replica_count: 1
min_replicas: 0
max_replicas: 2
scaling_unit: complete-replica
horizontal_scaling: true
scaler: keda-http-addon
requires_durable_interceptor: true
status: phase4c-lab
notes: |
  Live StatefulSet still renders replicas=1; KEDA minReplicaCount=0 owns the
  scale subresource. Phase 4B Prometheus ScaledObject is historical YAML only.
  Phase 4C: InterceptorRoute plus external-push ScaledObject, max=2, TP=1,
  one GPU per pod. Access is SSH plus port-forward, not public HTTP.
