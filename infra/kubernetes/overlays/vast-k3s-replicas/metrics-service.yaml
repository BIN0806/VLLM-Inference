apiVersion: v1
kind: Service
metadata:
  name: vllm-metrics
  namespace: inference
  labels:
    app: inference-platform
    component: vllm-metrics
spec:
  type: ClusterIP
  selector:
    app: inference-platform
    component: vllm
  ports:
  - name: metrics
    port: 8000
    targetPort: metrics
    protocol: TCP
