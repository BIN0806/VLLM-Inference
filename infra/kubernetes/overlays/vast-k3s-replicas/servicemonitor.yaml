apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: inference
  labels:
    app: inference-platform
    component: vllm
spec:
  selector:
    matchLabels:
      app: inference-platform
      component: vllm-metrics
  namespaceSelector:
    matchNames:
    - inference
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
