apiVersion: v1
kind: Service
metadata:
  name: vllm-headless
  namespace: inference
  labels:
    app: inference-platform
    component: vllm
    service: headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: inference-platform
    component: vllm
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
