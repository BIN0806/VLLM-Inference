apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-storage
  namespace: inference
  labels:
    app: inference-platform
    component: vllm
data:
  storageClassName: local-path
  accessMode: ReadWriteOnce
  modelCachePath: /root/.cache/huggingface
  pvcSize: 40Gi
  notes: k3s local-path PVC persists across pod restarts on this VM. It does not survive
    destruction of the Vast VM and is not provider-persistent storage. RWO for one
    replica.
