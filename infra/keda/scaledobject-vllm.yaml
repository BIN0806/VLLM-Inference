# KEDA 2.20.2 Prometheus scaler for Phase 4B.
# Target is the vLLM StatefulSet. Do not install the HTTP add-on.
# Do not set minReplicaCount to 0. activationThreshold is unused while min is 1.
# pollingInterval is recorded for scrape cadence but KEDA ignores it while min>=1;
# the generated HPA drives 1→N.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm
  namespace: inference
  labels:
    app: inference-platform
    component: vllm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: vllm
  pollingInterval: 15
  minReplicaCount: 1
  maxReplicaCount: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
          selectPolicy: Min
  triggers:
    - type: prometheus
      metricType: Value
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: sum(vllm:num_requests_waiting)
        threshold: "1"
        ignoreNullValues: "false"
