# Constrained-host Helm values for kedacore/keda-add-ons-http 0.15.0.
# Install into the existing keda namespace. Do not install Grafana, an
# ingress controller, extra monitoring stacks, or kind: HTTPScaledObject.
# Pin images.tag to 0.15.0. Record resolved image digests after install.

images:
  tag: "0.15.0"
  operator: ghcr.io/kedacore/http-add-on-operator
  interceptor: ghcr.io/kedacore/http-add-on-interceptor
  scaler: ghcr.io/kedacore/http-add-on-scaler

crds:
  install: true

operator:
  watchNamespace: inference
  replicas: 1
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

scaler:
  replicas: 1
  pullPolicy: IfNotPresent
  grpcPort: 9090
  metrics:
    prometheus:
      enabled: true
      port: 2223
    otlp:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

interceptor:
  pullPolicy: IfNotPresent
  replicas:
    min: 1
    max: 1
  proxy:
    port: 8080
    service: interceptor-proxy
  readinessTimeout: 240s
  requestTimeout: 420s
  responseHeaderTimeout: 300s
  pdb:
    enabled: true
    minAvailable: 0
    maxUnavailable: 1
  tls:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 64Mi

logging:
  operator:
    level: info
  scaler:
    level: info
  interceptor:
    level: info
