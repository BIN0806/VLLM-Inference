name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Python 3.12 lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install authoring dependencies from the lockfile
        run: uv sync --frozen --python 3.12 --extra dev

      - name: Ruff format
        run: uv run ruff format --check src tests scripts benchmarks

      - name: Ruff lint
        run: uv run ruff check src tests scripts benchmarks

      - name: Offline unit tests
        run: uv run pytest tests/unit -m unit --tb=short
